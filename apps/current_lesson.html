<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Current Lesson – Mr Stamatelopoulos</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #3b82f6;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #334155;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      background: linear-gradient(165deg, #0f172a 0%, #1e293b 60%, #0f172a 100%);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: calc(12px + var(--safe-top)) 16px calc(16px + var(--safe-bottom));
      padding-left: calc(16px + var(--safe-left));
      padding-right: calc(16px + var(--safe-right));
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    /* Header – compact on mobile */
    header {
      text-align: center;
      margin-bottom: 12px;
      width: 100%;
      max-width: 420px;
      flex-shrink: 0;
    }
    header h1 {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    header .sub {
      color: var(--muted);
      font-size: 0.75rem;
      margin-top: 2px;
    }
    .clock {
      font-size: 0.95rem;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      margin-top: 6px;
      font-weight: 500;
    }

    /* Main card – fills available space */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px 16px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      text-align: center;
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
    }

    .day-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .lesson-num {
      font-size: clamp(2.2rem, 10vw, 2.8rem);
      font-weight: 700;
      color: var(--accent);
      line-height: 1.1;
      margin-bottom: 4px;
    }

    .lesson-time {
      font-size: 1.05rem;
      color: var(--text);
      margin-bottom: 14px;
      font-variant-numeric: tabular-nums;
    }

    .room {
      font-size: clamp(1.5rem, 7vw, 1.9rem);
      font-weight: 600;
      background: rgba(59, 130, 246, 0.18);
      border: 1px solid rgba(59, 130, 246, 0.45);
      border-radius: 14px;
      padding: 10px 16px;
      display: inline-block;
      margin-bottom: 12px;
      letter-spacing: 0.04em;
      max-width: 100%;
      word-break: break-word;
    }

    .subject {
      font-size: 1.1rem;
      color: var(--text);
      margin-bottom: 4px;
      font-weight: 500;
    }

    .code {
      font-size: 0.8rem;
      color: var(--muted);
      word-break: break-all;
    }

    .status {
      margin-top: 14px;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      display: inline-block;
    }
    .status.teaching { background: rgba(34, 197, 94, 0.18); color: #4ade80; }
    .status.duty     { background: rgba(245, 158, 11, 0.18); color: #fbbf24; }
    .status.free     { background: rgba(100, 116, 139, 0.25); color: #94a3b8; }
    .status.outside  { background: rgba(148, 163, 184, 0.15); color: #94a3b8; }

    /* Bottom nav – large touch targets */
    .nav {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      width: 100%;
      max-width: 420px;
      flex-shrink: 0;
    }

    button {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      min-height: 52px;
      padding: 12px 8px;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }
    button:active {
      transform: scale(0.96);
      background: #334155;
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      flex: 1.15;
    }
    button.primary:active {
      background: #2563eb;
    }

    .hint {
      margin-top: 12px;
      font-size: 0.7rem;
      color: var(--muted);
      text-align: center;
      max-width: 420px;
      line-height: 1.35;
      flex-shrink: 0;
    }

    footer {
      margin-top: 10px;
      font-size: 0.65rem;
      color: #64748b;
      text-align: center;
      flex-shrink: 0;
    }

    /* Slightly larger on wider phones / tablets */
    @media (min-width: 400px) {
      header h1 { font-size: 1.2rem; }
      .card { padding: 24px 20px; }
      .lesson-num { font-size: 2.6rem; }
      .room { font-size: 1.85rem; }
    }

    /* Landscape phones – keep everything visible without scroll */
    @media (max-height: 500px) and (orientation: landscape) {
      body { padding-top: 8px; padding-bottom: 8px; }
      header { margin-bottom: 6px; }
      header h1 { font-size: 0.95rem; }
      .sub, .hint, footer { display: none; }
      .card { padding: 12px 16px; border-radius: 14px; }
      .lesson-num { font-size: 1.8rem; }
      .lesson-time { font-size: 0.95rem; margin-bottom: 8px; }
      .room { font-size: 1.3rem; padding: 6px 12px; margin-bottom: 6px; }
      .subject { font-size: 0.95rem; }
      .status { margin-top: 8px; padding: 4px 10px; font-size: 0.8rem; }
      .nav { margin-top: 10px; }
      button { min-height: 44px; padding: 8px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Mount Carmel College</h1>
    <div class="sub">Mr Phillip Stamatelopoulos</div>
    <div class="clock" id="clock">--:--:--</div>
  </header>

  <div class="card" id="card">
    <div class="day-label" id="dayLabel">—</div>
    <div class="lesson-num" id="lessonNum">—</div>
    <div class="lesson-time" id="lessonTime">—</div>
    <div class="room" id="room">—</div>
    <div class="subject" id="subject">—</div>
    <div class="code" id="code"></div>
    <div class="status" id="status">—</div>
  </div>

  <div class="nav">
    <button id="prevBtn" aria-label="Previous period">← Prev</button>
    <button class="primary" id="nowBtn" aria-label="Go to current time">Now</button>
    <button id="nextBtn" aria-label="Next period">Next →</button>
  </div>

  <p class="hint">
    Live ACST time · Arrows step through periods
  </p>

  <footer>
    Week 20–26 Sep 2026
  </footer>

  <script>
    // Period definitions (start/end as minutes past midnight)
    // Includes short movement / transition slots so the day is continuous 8:24–15:00
    const PERIODS = [
      { id: 'MOV1', name: 'Morning Movement Bell', short: 'Move', start: 8*60+24, end: 8*60+26 },
      { id: 'PC',   name: 'Pastoral Care / Home Class', short: 'PC',   start: 8*60+26, end: 8*60+40 },
      { id: 'L1',   name: 'Lesson 1', short: 'L1',   start: 8*60+40, end: 9*60+20 },
      { id: 'L2',   name: 'Lesson 2', short: 'L2',   start: 9*60+20, end: 10*60+0 },
      { id: 'L3',   name: 'Lesson 3', short: 'L3',   start: 10*60+0, end: 10*60+40 },
      { id: 'REC',  name: 'Recess', short: 'Recess', start: 10*60+40, end: 10*60+58 },
      { id: 'MOV2', name: 'Recess Movement Bell', short: 'Move', start: 10*60+58, end: 11*60+0 },
      { id: 'L4',   name: 'Lesson 4', short: 'L4',   start: 11*60+0, end: 11*60+40 },
      { id: 'L5',   name: 'Lesson 5', short: 'L5',   start: 11*60+40, end: 12*60+20 },
      { id: 'L6',   name: 'Lesson 6', short: 'L6',   start: 12*60+20, end: 13*60+0 },
      { id: 'LN1',  name: 'Lunch 1', short: 'Lunch 1', start: 13*60+0, end: 13*60+20 },
      { id: 'LN2',  name: 'Lunch 2', short: 'Lunch 2', start: 13*60+20, end: 13*60+38 },
      { id: 'MOV3', name: 'Lunch Movement Bell', short: 'Move', start: 13*60+38, end: 13*60+40 },
      { id: 'L7',   name: 'Lesson 7', short: 'L7',   start: 13*60+40, end: 14*60+20 },
      { id: 'L8',   name: 'Lesson 8', short: 'L8',   start: 14*60+20, end: 15*60+0 }
    ];

    // Schedule for Mon=0 ... Fri=4  (week of 21–25 Sep 2026)
    const SCHEDULE = {
      0: { // Monday
        PC:  { room: 'S104S', subject: 'Pastoral Care', code: '11PC3', type: 'class' },
        L1:  { room: 'E001S', subject: 'Mathematics', code: '7MATHB / 7MATHBM', type: 'class' },
        L2:  { room: 'E001S', subject: 'Mathematics', code: '7MATHB / 7MATHBM', type: 'class' },
        L3:  { room: 'T104S', subject: 'STEM', code: '7STEM4 / 7STEM4M', type: 'class' },
        L4:  { room: 'T104S', subject: 'STEM', code: '7STEM4 / 7STEM4M', type: 'class' },
        L5:  { room: 'P117S', subject: 'Study', code: 'STUDY.R2.MON5', type: 'class' },
        L6:  { room: '—', subject: 'Free', code: '', type: 'free' },
        LN1: { room: 'JC Courtyard / Toilets', subject: 'Duty – Lunch 1', code: 'DUTY.L1JCT', type: 'duty' },
        LN2: { room: '—', subject: 'Free', code: '', type: 'free' },
        L7:  { room: 'T104S', subject: 'Digital Technologies', code: '8DIGY / 8DIGYM', type: 'class' },
        L8:  { room: 'T104S', subject: 'Digital Technologies', code: '8DIGY / 8DIGYM', type: 'class' }
      },
      1: { // Tuesday
        PC:  { room: 'S104S', subject: 'Pastoral Care', code: '11PC3', type: 'class' },
        L1:  { room: 'S007S', subject: 'STEM', code: '7STEM5 / 7STEM5M', type: 'class' },
        L2:  { room: 'S007S', subject: 'STEM', code: '7STEM5 / 7STEM5M', type: 'class' },
        L3:  { room: 'T104S', subject: 'Digital Technologies', code: '9DIG2 / 9DIG2M', type: 'class' },
        L4:  { room: 'T104S', subject: 'Digital Technologies', code: '9DIG2 / 9DIG2M', type: 'class' },
        L5:  { room: 'T101S', subject: 'STEM', code: '8STEM2 / 8STEM2M', type: 'class' },
        L6:  { room: 'T101S', subject: 'STEM', code: '8STEM2 / 8STEM2M', type: 'class' },
        LN1: { room: 'Amphitheatre / Sth Grass / Locker', subject: 'Duty – Lunch 1', code: 'DUTY.L1ASG', type: 'duty' },
        LN2: { room: '—', subject: 'Free', code: '', type: 'free' },
        L7:  { room: 'T104S', subject: 'Digital Technologies', code: '10DIT1 / 10DIT1M', type: 'class' },
        L8:  { room: 'T104S', subject: 'Digital Technologies', code: '10DIT1 / 10DIT1M', type: 'class' }
      },
      2: { // Wednesday
        PC:  { room: 'S104S', subject: 'Pastoral Care', code: '11PC3', type: 'class' },
        L1:  { room: '—', subject: 'Free', code: '', type: 'free' },
        L2:  { room: 'T104S', subject: 'Digital Technologies', code: '8DIGR / 8DIGRM', type: 'class' },
        L3:  { room: 'T104S', subject: 'Digital Technologies', code: '8DIGR / 8DIGRM', type: 'class' },
        L4:  { room: 'S007S', subject: 'Digital Technologies', code: '9DIG2 / 9DIG2M', type: 'class' },
        L5:  { room: 'T101S', subject: 'STEM', code: '8STEM2 / 8STEM2M', type: 'class' },
        L6:  { room: 'T101S', subject: 'STEM', code: '8STEM2 / 8STEM2M', type: 'class' },
        LN1: { room: '—', subject: 'Free', code: '', type: 'free' },
        LN2: { room: '—', subject: 'Free', code: '', type: 'free' },
        L7:  { room: 'T104S', subject: 'Digital Technologies', code: '10DIT1 / 10DIT1M', type: 'class' },
        L8:  { room: 'T104S', subject: 'Digital Technologies', code: '10DIT1 / 10DIT1M', type: 'class' }
      },
      3: { // Thursday
        PC:  { room: 'S104S', subject: 'Pastoral Care', code: '11PC3', type: 'class' },
        L1:  { room: 'T101S', subject: 'STEM', code: '8STEM7 / 8STEM7M', type: 'class' },
        L2:  { room: 'T101S', subject: 'STEM', code: '8STEM7 / 8STEM7M', type: 'class' },
        L3:  { room: '—', subject: 'Free', code: '', type: 'free' },
        L4:  { room: 'E001S', subject: 'Mathematics', code: '7MATHB / 7MATHBM', type: 'class' },
        L5:  { room: 'S104S', subject: 'Pastoral Care', code: '11PC3', type: 'class' },
        L6:  { room: 'S104S', subject: 'Pastoral Care', code: '11PC3', type: 'class' },
        LN1: { room: '—', subject: 'Free', code: '', type: 'free' },
        LN2: { room: '—', subject: 'Free', code: '', type: 'free' },
        L7:  { room: 'S007S', subject: 'STEM', code: '8STEM5 / 8STEM5M', type: 'class' },
        L8:  { room: 'S007S', subject: 'STEM', code: '8STEM5 / 8STEM5M', type: 'class' }
      },
      4: { // Friday
        PC:  { room: 'S104S', subject: 'Pastoral Care', code: '11PC3', type: 'class' },
        L1:  { room: 'T101S', subject: 'STEM', code: '8STEM7 / 8STEM7M', type: 'class' },
        L2:  { room: 'T101S', subject: 'STEM', code: '8STEM7 / 8STEM7M', type: 'class' },
        L3:  { room: '—', subject: 'Free', code: '', type: 'free' },
        L4:  { room: '—', subject: 'Free', code: '', type: 'free' },
        L5:  { room: '—', subject: 'Free', code: '', type: 'free' },
        L6:  { room: '—', subject: 'Free', code: '', type: 'free' },
        LN1: { room: '—', subject: 'Free', code: '', type: 'free' },
        LN2: { room: 'Amphitheatre / Sth Grass / Locker', subject: 'Duty – Lunch 2', code: 'DUTY.L2ASG', type: 'duty' },
        L7:  { room: 'E001S', subject: 'Mathematics', code: '7MATHB / 7MATHBM', type: 'class' },
        L8:  { room: 'E001S', subject: 'Mathematics', code: '7MATHB / 7MATHBM', type: 'class' }
      }
    };

    const DAY_NAMES = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
    let override = null; // { dayIdx, periodIdx } or null for live

    const TZ = 'Australia/Adelaide';

    function getAdelaideParts(date = new Date()) {
      const fmt = new Intl.DateTimeFormat('en-AU', {
        timeZone: TZ,
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit',
        hour12: false, weekday: 'short'
      });
      const parts = Object.fromEntries(fmt.formatToParts(date).map(p => [p.type, p.value]));
      return {
        year: +parts.year, month: +parts.month, day: +parts.day,
        hour: +parts.hour, minute: +parts.minute, second: +parts.second,
        weekday: parts.weekday
      };
    }

    function minutesNow() {
      const p = getAdelaideParts();
      return p.hour * 60 + p.minute + p.second / 60;
    }

    function getDayIndex(date = new Date()) {
      const p = getAdelaideParts(date);
      const map = { Mon:0, Tue:1, Wed:2, Thu:3, Fri:4, Sat:-1, Sun:-1 };
      return map[p.weekday] ?? -1;
    }

    function formatTime(mins) {
      const h = Math.floor(mins / 60);
      const m = Math.floor(mins % 60);
      const ampm = h >= 12 ? 'pm' : 'am';
      const h12 = h % 12 || 12;
      return `${h12}:${m.toString().padStart(2,'0')}${ampm}`;
    }

    function findCurrentPeriodIdx(mins) {
      for (let i = 0; i < PERIODS.length; i++) {
        if (mins >= PERIODS[i].start && mins < PERIODS[i].end) return i;
      }
      return -1;
    }

    function getDisplayData() {
      const now = new Date();
      let dayIdx, periodIdx, isLive = true;

      if (override) {
        dayIdx = override.dayIdx;
        periodIdx = override.periodIdx;
        isLive = false;
      } else {
        dayIdx = getDayIndex(now);
        periodIdx = findCurrentPeriodIdx(minutesNow());
      }

      if (dayIdx < 0) {
        return {
          dayLabel: 'Weekend',
          lessonNum: '—',
          lessonTime: 'School closed',
          room: '—',
          subject: 'No lessons today',
          code: '',
          status: 'outside',
          statusText: 'Weekend',
          isLive
        };
      }

      if (periodIdx < 0) {
        const mins = isLive ? minutesNow() : (PERIODS[0].start - 1);
        let msg = 'Outside school hours';
        if (mins < PERIODS[0].start) msg = 'Before school (from 8:24am)';
        else if (mins >= PERIODS[PERIODS.length-1].end) msg = 'School finished (after 3:00pm)';
        return {
          dayLabel: DAY_NAMES[dayIdx] + (isLive ? '' : ' · viewing'),
          lessonNum: '—',
          lessonTime: msg,
          room: '—',
          subject: 'No current lesson',
          code: '',
          status: 'outside',
          statusText: msg,
          isLive
        };
      }

      const period = PERIODS[periodIdx];
      const daySched = SCHEDULE[dayIdx] || {};
      const entry = daySched[period.id] || { room: '—', subject: 'Free', code: '', type: 'free' };

      let subject = entry.subject;
      let room = entry.room;
      let type = entry.type;
      let code = entry.code;

      if (period.id === 'REC') {
        subject = 'Recess'; room = '—'; type = 'free'; code = '';
      } else if (period.id.startsWith('MOV')) {
        subject = period.name; room = '—'; type = 'free'; code = '';
      }

      const timeStr = `${formatTime(period.start)} – ${formatTime(period.end)}`;
      const statusClass = type === 'class' ? 'teaching' : type === 'duty' ? 'duty' : 'free';
      const statusText = type === 'class' ? 'Teaching' : type === 'duty' ? 'Duty' : (period.id.startsWith('MOV') ? 'Movement' : 'Free');

      return {
        dayLabel: DAY_NAMES[dayIdx] + (isLive ? '' : ' · viewing'),
        lessonNum: period.short,
        lessonTime: timeStr,
        room, subject, code,
        status: statusClass,
        statusText,
        isLive, dayIdx, periodIdx
      };
    }

    function render() {
      const data = getDisplayData();
      document.getElementById('dayLabel').textContent = data.dayLabel;
      document.getElementById('lessonNum').textContent = data.lessonNum;
      document.getElementById('lessonTime').textContent = data.lessonTime;
      document.getElementById('room').textContent = data.room;
      document.getElementById('subject').textContent = data.subject;
      document.getElementById('code').textContent = data.code || '';
      const statusEl = document.getElementById('status');
      statusEl.textContent = data.statusText;
      statusEl.className = 'status ' + data.status;

      const now = new Date();
      const timeStr = now.toLocaleTimeString('en-AU', {
        timeZone: TZ, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
      });
      document.getElementById('clock').textContent =
        timeStr + ' ACST' + (data.isLive ? '' : ' · paused');
    }

    function step(delta) {
      let dayIdx, periodIdx;
      if (override) {
        dayIdx = override.dayIdx;
        periodIdx = override.periodIdx;
      } else {
        dayIdx = getDayIndex();
        if (dayIdx < 0) dayIdx = 0;
        periodIdx = findCurrentPeriodIdx(minutesNow());
        if (periodIdx < 0) periodIdx = delta > 0 ? 0 : PERIODS.length - 1;
      }

      periodIdx += delta;
      if (periodIdx >= PERIODS.length) {
        periodIdx = 0;
        dayIdx = (dayIdx + 1) % 5;
      } else if (periodIdx < 0) {
        periodIdx = PERIODS.length - 1;
        dayIdx = (dayIdx + 4) % 5;
      }
      override = { dayIdx, periodIdx };
      render();
    }

    document.getElementById('prevBtn').addEventListener('click', () => step(-1));
    document.getElementById('nextBtn').addEventListener('click', () => step(1));
    document.getElementById('nowBtn').addEventListener('click', () => {
      override = null;
      render();
    });

    // Prevent double-tap zoom on buttons (iOS)
    document.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('touchend', e => { e.preventDefault(); btn.click(); }, { passive: false });
    });

    render();
    setInterval(render, 1000);
  </script>
</body>
</html>
